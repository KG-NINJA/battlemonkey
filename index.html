<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>BATTLE MONKEY 3D</title>
  <style>
    :root{--ink:#dce8d7;--dim:#879985;--panel:rgba(8,15,12,.9);--line:#37513d;--lime:#a7ff6a;--amber:#ffd34d;--red:#ff5d52}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#070b09;color:var(--ink);font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif}
    button{font:inherit}
    #game{position:fixed;inset:0;touch-action:none}
    canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
    #grain{position:fixed;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:screen;background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(178,255,154,.08) 4px)}
    .panel{background:linear-gradient(180deg,rgba(14,25,19,.94),rgba(5,10,8,.94));border:1px solid var(--line);box-shadow:0 12px 35px #0008,inset 0 0 22px #1f3a2840}
    #topbar{position:fixed;left:18px;right:18px;top:16px;height:64px;display:flex;align-items:center;gap:18px;padding:9px 14px;pointer-events:none}
    .brand{font-weight:900;font-size:21px;letter-spacing:.17em;color:var(--lime);text-shadow:0 0 12px #79ff5b70;white-space:nowrap}
    .brand small{display:block;margin-top:3px;font-size:8px;color:var(--dim);letter-spacing:.42em}
    .divider{width:1px;height:34px;background:var(--line)}
    .stat{min-width:72px}.label{font-size:9px;letter-spacing:.18em;color:var(--dim)}.value{margin-top:2px;font-family:Consolas,monospace;font-weight:700}
    .bar{width:110px;height:7px;margin-top:4px;background:#152018;border:1px solid #314736}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#e9483e,#e1d54d,#72df61);transition:width .25s}
    #mission{margin-left:auto;text-align:right;max-width:360px}.mission-title{font-size:10px;color:var(--amber);letter-spacing:.16em}.mission-copy{font-size:11px;color:#9dad9b;margin-top:3px}.reference-link{color:#8fa28f;text-decoration:none;border-bottom:1px solid #405846}.reference-link:hover{color:var(--lime)}
    #radar{position:fixed;right:18px;top:96px;width:164px;height:184px;padding:10px}
    #radar h2,#log h2{font-size:10px;letter-spacing:.22em;color:var(--lime);margin:0 0 8px}
    #minimap{width:142px;height:142px;background:#080d0a;border:1px solid #29402f;image-rendering:pixelated}
    #log{position:fixed;left:18px;bottom:132px;width:270px;min-height:116px;padding:11px 13px;pointer-events:none}
    #messages{font-family:Consolas,monospace;font-size:11px;line-height:1.55;color:#9fb09d}
    #messages div:first-child{color:#e6f3df}
    #controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:7px;padding:9px}
    #weapons{position:fixed;left:50%;bottom:103px;transform:translateX(-50%);display:flex;gap:5px;padding:6px}
    .weapon{min-width:94px;padding:7px 10px;border:1px solid #354d3b;background:#0b140f;color:#8fa28f;cursor:pointer;font-size:10px;letter-spacing:.08em;touch-action:manipulation}
    .weapon b{color:#dce8d7}.weapon.active{border-color:var(--amber);color:var(--amber);box-shadow:inset 0 -2px var(--amber),0 0 15px #ffd34d18}.weapon:disabled{opacity:.35;cursor:not-allowed}
    .cmd{position:relative;width:82px;height:62px;border:1px solid #3c5843;background:linear-gradient(#1a2a20,#0c1510);color:#dbe8d7;cursor:pointer;transition:.12s;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);touch-action:manipulation}
    .cmd:hover{border-color:var(--lime);color:var(--lime);transform:translateY(-2px);box-shadow:0 0 18px #62ff6e25}.cmd:active{transform:translateY(1px)}
    .cmd b{display:block;font-size:14px;letter-spacing:.1em}.cmd span{display:block;margin-top:5px;font:9px Consolas,monospace;color:#718572}
    .cmd.fire{border-color:#8e7330;color:var(--amber)}.cmd.hide{border-color:#406b52}
    #aimHint{position:fixed;left:50%;top:94px;transform:translateX(-50%);padding:8px 15px;border:1px solid #8e7330;background:#120f07d9;color:var(--amber);font:11px Consolas,monospace;letter-spacing:.06em;display:none;pointer-events:none}
    #toast{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);font-weight:900;letter-spacing:.28em;font-size:clamp(24px,5vw,54px);text-shadow:0 3px 18px #000;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center}
    #screen{position:fixed;inset:0;background:#050907e8;display:none;place-items:center;text-align:center;z-index:5}
    #screen.show{display:grid}.result{padding:34px 46px;border:1px solid var(--line);background:#0b130f}.result h1{margin:0;color:var(--lime);letter-spacing:.18em}.result p{color:var(--dim)}.result button{padding:12px 26px;background:#17261c;color:var(--lime);border:1px solid #52705a;cursor:pointer}
    #scope{position:fixed;width:74px;height:74px;border:2px solid var(--amber);border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%);box-shadow:0 0 0 9999px #02050445,inset 0 0 14px #000}
    #scope:before,#scope:after{content:"";position:absolute;background:var(--amber);opacity:.8}
    #scope:before{left:-12px;right:-12px;top:35px;height:1px}#scope:after{top:-12px;bottom:-12px;left:35px;width:1px}
    #scope i{position:absolute;width:7px;height:7px;border:1px solid var(--amber);border-radius:50%;left:31px;top:31px}
    @media(max-width:780px){
      #topbar{left:8px;right:8px;top:8px;height:58px;gap:10px}.brand{font-size:14px}.brand small,.divider,#mission,.stat.turn{display:none}.stat{min-width:54px}.bar{width:70px}
      #radar{right:8px;top:74px;width:116px;height:136px;padding:7px}#minimap{width:100px;height:100px}#radar h2{margin-bottom:5px}
      #log{left:8px;bottom:104px;width:210px;min-height:84px;padding:8px}#messages{font-size:9px}#messages div:nth-child(n+4){display:none}
      #weapons{bottom:88px;width:calc(100% - 12px);gap:2px;padding:4px}.weapon{flex:1;min-width:0;padding:6px 2px;font-size:8px}
      #controls{bottom:8px;width:calc(100% - 12px);gap:4px;padding:5px}.cmd{flex:1;width:auto;height:76px;padding:4px}.cmd b{font-size:11px}.cmd span{font-size:8px}
    }
  </style>
</head>
<body>
  <div id="game"></div><div id="grain"></div>
  <header id="topbar" class="panel">
    <div class="brand">BATTLE MONKEY<small>POLYGON TACTICS</small></div><div class="divider"></div>
    <div class="stat"><div class="label">VITAL</div><div class="bar"><i id="hpBar" style="width:100%"></i></div></div>
    <div class="stat"><div class="label">AMMO</div><div class="value" id="ammo">08 / 08</div></div>
    <div class="stat turn"><div class="label">STAGE / TURN</div><div class="value"><span id="stage">01</span> / <span id="turn">001</span></div></div>
    <div class="stat"><div class="label">HOSTILES</div><div class="value" id="enemyCount">00</div></div>
    <div id="mission"><div class="mission-title">VR COMBAT SIM: GREEN SHADOW</div><div class="mission-copy">仮想戦場シミュレーション内で敵アバターを突破し、黄色の転送出口へ到達せよ。<a class="reference-link" href="https://trophylab.mod.gov.ua/en/" target="_blank" rel="noopener">High-level reference: Trophy Lab</a></div></div>
  </header>
  <aside id="radar" class="panel"><h2>TACTICAL MAP</h2><canvas id="minimap" width="142" height="142"></canvas></aside>
  <aside id="log" class="panel"><h2>SIM LOG</h2><div id="messages"></div></aside>
  <div id="aimHint">照準モード: マウス/タッチで照準移動 ・ クリック/指を離す/SPACEで射撃 ・ ESCで解除</div>
  <nav id="weapons" class="panel">
    <button class="weapon active" data-weapon="rifle"><b>1 小銃</b> ×<span>8</span></button>
    <button class="weapon" data-weapon="grenade"><b>2 手りゅう弾</b> ×<span>3</span></button>
    <button class="weapon" data-weapon="bazooka"><b>3 バズーカ</b> ×<span>2</span></button>
    <button class="weapon" data-weapon="aa"><b>4 対空火器</b> ×<span>2</span></button>
    <button class="weapon" data-weapon="knife" title="正面1マス / 弾数無制限"><b>K ナイフ</b> 正面1 ×<span>∞</span></button>
  </nav>
  <nav id="controls" class="panel">
    <button class="cmd" data-action="forward"><b>▲ 前進</b><span>W / ↑</span></button>
    <button class="cmd" data-action="left"><b>↶ 左回転</b><span>A / ←</span></button>
    <button class="cmd" data-action="right"><b>↷ 右回転</b><span>D / →</span></button>
    <button class="cmd fire" data-action="aim"><b>◎ 射撃</b><span>SPACE</span></button>
    <button class="cmd hide" data-action="hide"><b>▰ 潜伏</b><span>S / ↓</span></button>
    </nav>
  <div id="scope"><i></i></div><div id="toast"></div>
  <div id="screen"><div class="result"><h1 id="resultTitle">SIM CLEAR</h1><p id="resultCopy"></p><button onclick="location.reload()">REBOOT SIM</button></div></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (() => {
    "use strict";
    const SIZE=15, CELL=3, HALF=(SIZE-1)*CELL/2;
    const MAP=[
      "###############",
      "#P....#....∽..#",
      "#.##..#..E.∽..#",
      "#....∽...##...#",
      "#.E..∽........#",
      "#.###...∽.###.#",
      "#.....#∽......#",
      "###...#...E...#",
      "#...∽...##....#",
      "#.E.∽.........#",
      "#...####..∽...#",
      "#......E..∽##.#",
      "#.∽..#........#",
      "#....#....E.G.#",
      "###############"
    ];
    const state={stage:1,turn:1,hp:5,weapon:"rifle",ammo:{rifle:8,grenade:3,bazooka:2,aa:2,knife:"∞"},over:false,busy:false,aiming:false,hidden:false,aimCell:{x:1,z:1},dir:1,player:null,enemies:[],effects:[]};
    const weapons={
      rifle:{name:"小銃",damage:1,color:0xffdf4d,range:12},
      grenade:{name:"手りゅう弾",damage:2,color:0xff8a32,range:5,splash:true},
      bazooka:{name:"バズーカ",damage:3,color:0xffbe55,range:9,splash:true},
      aa:{name:"対空火器",damage:3,color:0x78dfff,range:12,antiAir:true},
      knife:{name:"ナイフ",damage:1,color:0xd7efff,melee:true}
    };
    const scene=new THREE.Scene(); scene.background=new THREE.Color(0x07100b); scene.fog=new THREE.FogExp2(0x07100b,.025);
    const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,180);
    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    document.getElementById("game").appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xb7d6bd,0x172016,1.15));
    const sun=new THREE.DirectionalLight(0xfff0c2,1.15); sun.position.set(-18,28,-12); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.left=-28;sun.shadow.camera.right=28;sun.shadow.camera.top=28;sun.shadow.camera.bottom=-28;scene.add(sun);
    const gridGroup=new THREE.Group(); scene.add(gridGroup);
    const meshes=[], clock=new THREE.Clock(), raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2(), cameraFollowDir=new THREE.Vector2(1,0);
    const mat=(color,extra={})=>new THREE.MeshStandardMaterial({color,flatShading:true,roughness:.82,...extra});
    const box=(w,h,d,m)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.castShadow=true;o.receiveShadow=true;return o};
    function world(x,z){return new THREE.Vector3(x*CELL-HALF,0,z*CELL-HALF)}
    function addPart(root,obj,x,y,z,rx=0,ry=0,rz=0){obj.position.set(x,y,z);obj.rotation.set(rx,ry,rz);root.add(obj);return obj}

    function makeGround(){
      const ground=new THREE.Mesh(new THREE.PlaneGeometry(SIZE*CELL,SIZE*CELL),mat(0x243329)); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
      const grid=new THREE.GridHelper(SIZE*CELL,SIZE,0x668069,0x354b3c); grid.position.y=.025; scene.add(grid);
      const border=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(SIZE*CELL,.3,SIZE*CELL)),new THREE.LineBasicMaterial({color:0x607c64})); border.position.y=-.13;scene.add(border);
    }
    function makeWall(x,z){
      const g=new THREE.Group(), base=box(CELL*.94,2.5,CELL*.94,mat(0x4c5650)); addPart(g,base,0,1.25,0);
      for(let y=.25;y<2.4;y+=.58) for(let k=-1;k<=1;k++){const brick=box(.78,.08,.035,new THREE.MeshBasicMaterial({color:0x768078})); addPart(g,brick,k*.82+(Math.round(y*10)%2?.4:0),y,CELL*.475+.02)}
      const p=world(x,z);g.position.copy(p);scene.add(g);meshes.push({mesh:base,x,z,type:"wall"});
    }
    function makeGrass(x,z){
      const g=new THREE.Group();
      for(let i=0;i<9;i++){const blade=new THREE.Mesh(new THREE.ConeGeometry(.16,.95,4),mat(i%2?0x3f7b43:0x285f37,{transparent:true,opacity:.76}));addPart(g,blade,(i%3-1)*.55,.45,((i/3|0)-1)*.55,0,(i*.7),i%2?.14:-.12)}
      const p=world(x,z);g.position.copy(p);scene.add(g);meshes.push({mesh:g,x,z,type:"grass"});
    }
    function makePlayer(x,z){
      const g=new THREE.Group();g.userData={x,z,type:"player"};
      addPart(g,box(1.15,1.25,.85,mat(0x3f8b4c)),0,1.2,0);
      addPart(g,box(.7,.55,.28,mat(0x25352a)),0,1.25,-.55);
      addPart(g,box(.72,.48,.08,new THREE.MeshBasicMaterial({color:0xe7c94d})),0,1.35,.47);
      const head=new THREE.Mesh(new THREE.IcosahedronGeometry(.62,0),mat(0x70ad65));addPart(g,head,0,2.12,0);
      addPart(g,box(.72,.32,.08,mat(0xb6d891)),0,2.16,.57);
      addPart(g,box(.12,.1,.06,new THREE.MeshBasicMaterial({color:0x101b13})),-.2,2.22,.63);
      addPart(g,box(.12,.1,.06,new THREE.MeshBasicMaterial({color:0x101b13})),.2,2.22,.63);
      addPart(g,box(.32,.72,.32,mat(0x304b31)),-.34,.42,0);addPart(g,box(.32,.72,.32,mat(0x304b31)),.34,.42,0);
      addPart(g,box(.25,.25,1.55,mat(0x202923)),.42,1.55,.78,-.08);
      addPart(g,box(.34,.34,.18,new THREE.MeshBasicMaterial({color:0xffd43d})),.42,1.55,1.62);
      const arrow=new THREE.Mesh(new THREE.ConeGeometry(.34,.9,3),new THREE.MeshBasicMaterial({color:0xffe04f,transparent:true,opacity:.9}));
      addPart(g,arrow,0,.08,1.55,Math.PI/2,0,0);
      const frontLight=new THREE.PointLight(0xffd84a,.7,3);addPart(g,frontLight,0,.25,1.3);
      const p=world(x,z);g.position.copy(p);g.rotation.y=directionAngle(state.dir);g.userData.rotCurrent=g.rotation.y;g.userData.rotTarget=g.rotation.y;scene.add(g);state.player=g;meshes.push({mesh:g,x,z,type:"player"});return g;
    }
    function makeEnemy(x,z,id){
      const g=new THREE.Group();g.userData={x,z,type:"enemy",hp:2,id,alive:true};
      const body=new THREE.Mesh(new THREE.OctahedronGeometry(.88,0),mat(0x9f2f2b));addPart(g,body,0,1.25,0);
      const head=new THREE.Mesh(new THREE.DodecahedronGeometry(.56,0),mat(0xd14b3e));addPart(g,head,0,2.08,0);
      for(let i=0;i<5;i++){const spike=new THREE.Mesh(new THREE.ConeGeometry(.16,.62,5),mat(0x4d1716));addPart(g,spike,(i-2)*.29,2.68,0,0,0,(i-2)*-.12)}
      addPart(g,box(.38,.75,.38,mat(0x59201e)),-.38,.48,0);addPart(g,box(.38,.75,.38,mat(0x59201e)),.38,.48,0);
      addPart(g,box(1.5,.18,.28,mat(0x281a18)),0,1.45,.48);
      const p=world(x,z);g.position.copy(p);scene.add(g);state.enemies.push(g);meshes.push({mesh:g,x,z,type:"enemy"});return g;
    }
    function makeBulwark(x,z,id){
      const g=new THREE.Group();g.userData={x,z,type:"bulwark",role:"BULWARK NODE",hp:3,id,alive:true,boss:true,shieldReady:true};
      const core=new THREE.Mesh(new THREE.DodecahedronGeometry(1.05,0),mat(0x66714c));addPart(g,core,0,1.25,0,0,.35,0);
      for(let i=0;i<3;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(1.42-i*.18,.07,6,12),mat(i===0?0xffb94c:0x455b3d));addPart(g,ring,0,1.25,0,Math.PI/2+i*.42,i*.55,0)}
      for(let i=0;i<4;i++){const pod=new THREE.Mesh(new THREE.OctahedronGeometry(.38,0),mat(0x35402d));addPart(g,pod,Math.cos(i*Math.PI/2)*1.3,.6,Math.sin(i*Math.PI/2)*1.3)}
      const lamp=new THREE.PointLight(0xffb24b,1.4,6);addPart(g,lamp,0,1.25,0);
      const p=world(x,z);g.position.copy(p);scene.add(g);state.enemies.push(g);meshes.push({mesh:g,x,z,type:"enemy"});log("警告: BULWARK NODE。最初の被弾を一度だけ遮断","#ff765f");return g;
    }
    function makeWisp(x,z,id){
      const g=new THREE.Group();g.userData={x,z,type:"wisp",role:"SKY WISP",hp:3,id,alive:true,boss:true};
      const core=new THREE.Mesh(new THREE.OctahedronGeometry(.9,0),mat(0x5c5b87));addPart(g,core,0,3.35,0,0,.35,0);
      for(let i=0;i<3;i++){const shard=new THREE.Mesh(new THREE.TetrahedronGeometry(.55,0),mat(i===0?0x9c7dff:0x38364f));addPart(g,shard,Math.cos(i*2.1)*1.15,3.35,Math.sin(i*2.1)*1.15,0,i,0)}
      const halo=new THREE.Mesh(new THREE.TorusGeometry(1.45,.06,5,15),new THREE.MeshBasicMaterial({color:0x8d7dff}));addPart(g,halo,0,3.35,0,Math.PI/2,.3,0);
      const light=new THREE.PointLight(0x8d7dff,1.6,8);addPart(g,light,0,3.35,0);
      const p=world(x,z);g.position.copy(p);scene.add(g);state.enemies.push(g);meshes.push({mesh:g,x,z,type:"enemy"});log("警告: SKY WISP。位相跳躍と長射程を確認","#ff765f");return g;
    }
    function makeGoal(x,z){
      const g=new THREE.Group(), glow=new THREE.MeshBasicMaterial({color:0xffdc42});
      const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.95,0),glow);addPart(g,crystal,0,1.35,0);
      const ring=new THREE.Mesh(new THREE.TorusGeometry(1.25,.08,8,24),new THREE.MeshBasicMaterial({color:0xffb82e}));addPart(g,ring,0,.2,0,Math.PI/2);
      const light=new THREE.PointLight(0xffcc33,2.2,9);addPart(g,light,0,1.4,0);
      g.userData={x,z,type:"goal",crystal,ring};const p=world(x,z);g.position.copy(p);scene.add(g);meshes.push({mesh:g,x,z,type:"goal"});state.goal=g;
    }
    makeGround();
    let enemyId=0;
    const enemySpawns=[];
    MAP.forEach((row,z)=>[...row].forEach((c,x)=>{if(c==="#")makeWall(x,z);else if(c==="∽")makeGrass(x,z);else if(c==="P")makePlayer(x,z);else if(c==="E")enemySpawns.push({x,z});else if(c==="G")makeGoal(x,z)}));
    function spawnStage(stage){
      state.enemies.forEach(e=>scene.remove(e));state.enemies=[];
      const count=stage===1?4:stage===2?5:6;
      enemySpawns.slice(0,count).forEach(p=>makeEnemy(p.x,p.z,enemyId++));
      if(stage===2)makeBulwark(11,11,enemyId++);
      if(stage===3)makeWisp(10,3,enemyId++);
      playSfx.stage();
      log(`STAGE ${stage}: ${stage===1?"前哨地帯":stage===2?"防壁ノード戦":"空域異常戦"}`,"#a7ff6a");
    }

    const cursor=new THREE.Mesh(new THREE.RingGeometry(1.05,1.35,4),new THREE.MeshBasicMaterial({color:0xffd13c,side:THREE.DoubleSide,transparent:true,opacity:.9}));
    cursor.rotation.x=-Math.PI/2;cursor.rotation.z=Math.PI/4;cursor.position.y=.07;cursor.visible=false;scene.add(cursor);
    const scope=document.getElementById("scope");
    let touchAiming=false;
    let audioCtx=null, pendingStageJingle=false;

      const bossMark=(x,z,dx,dz,fill,stroke)=>{const cx=(x+.5)*s,cy=(z+.5)*s;g.save();g.translate(cx,cy);g.strokeStyle=stroke;g.lineWidth=2;g.beginPath();g.arc(0,0,s*.46,0,Math.PI*2);g.stroke();g.restore();arrow(x,z,dx,dz,fill,s*.5)};
      const pathArrow=(x,z,dx,dz,color)=>{const sx=(x+.5)*s,sy=(z+.5)*s,ex=(x+.5+dx*.9)*s,ey=(z+.5+dz*.9)*s;g.strokeStyle=color;g.lineWidth=2;g.beginPath();g.moveTo(sx,sy);g.lineTo(ex,ey);g.stroke();arrow(x+dx*.52,z+dz*.52,dx,dz,color,s*.24)};
      state.enemies.filter(e=>e.userData.alive).forEach(e=>{const dx=Math.sin(e.rotation.y),dz=Math.cos(e.rotation.y);if(e.userData.boss)bossMark(e.userData.x,e.userData.z,dx,dz,e.userData.type==="wisp"?"#b59cff":"#ff8f48",e.userData.type==="wisp"?"#efe2ff":"#fff0a8");else arrow(e.userData.x,e.userData.z,dx,dz,"#ef4b3d",s*.36)});
      const p=state.player.userData,dir=dirs[state.dir];
      pathArrow(p.x,p.z,dir.x,dir.z,"#c9ff6a");
      arrow(p.x,p.z,dir.x,dir.z,"#87ff6d",s*.46);
    }
    document.querySelectorAll(".cmd[data-action]").forEach(b=>b.addEventListener("click",()=>playerAction(b.dataset.action)));
    function selectWeapon(name){if(state.busy||state.aiming||(state.ammo[name]!=="∞"&&state.ammo[name]<=0))return;state.weapon=name;log(`${weapons[name].name}を装備`);updateHUD()}
    document.querySelectorAll(".weapon").forEach(b=>b.addEventListener("click",()=>selectWeapon(b.dataset.weapon)));
    addEventListener("keydown",e=>{
      if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();
      if(e.code==="KeyK"){knifeStrike();return}
      if(/^Digit[1-5]$/.test(e.code)){selectWeapon(["rifle","grenade","bazooka","aa","knife"][Number(e.code.slice(-1))-1]);return}
      if(e.code==="KeyK"){selectWeapon("knife");return}
      if(e.code==="Escape"&&state.aiming)return toggleAim();if(e.code==="Space"){if(state.aiming)fire();else playerAction("aim");return}
      const map={ArrowUp:"forward",KeyW:"forward",ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",ArrowDown:"hide",KeyS:"hide"};if(map[e.code])playerAction(map[e.code]);
    });
    addEventListener("pointerdown",unlockAudio,{once:false});
    addEventListener("keydown",unlockAudio,{once:false});
    renderer.domElement.addEventListener("pointermove",e=>{if(state.aiming&&(!touchAiming||e.pointerType==="touch"))aimFromPointer(e)});
    renderer.domElement.addEventListener("pointerdown",e=>{if(!state.aiming)return;if(e.pointerType==="touch"){beginTouchAim(e);return}aimFromPointer(e);fire()});
    renderer.domElement.addEventListener("pointerup",e=>{if(e.pointerType==="touch")endTouchAim(e)});
    renderer.domElement.addEventListener("pointercancel",()=>{touchAiming=false;scope.style.display=state.aiming?"block":"none";});
    addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
    function animate(){
      requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),t=performance.now()*.001;
      [state.player,...state.enemies].forEach(o=>{
        if(o?.userData?.t!==undefined&&o.userData.t<1){o.userData.t=Math.min(1,o.userData.t+dt/o.userData.duration);const q=1-Math.pow(1-o.userData.t,3);o.position.lerpVectors(o.userData.from,o.userData.to,q);o.position.y=Math.sin(o.userData.t*Math.PI)*.2}
        if(o!==state.player&&o?.userData?.rotTarget!==undefined){
          o.userData.rotCurrent ??= o.rotation.y;
          o.userData.rotCurrent+=shortestAngleDelta(o.userData.rotCurrent,o.userData.rotTarget)*Math.min(1,dt*9);
          o.rotation.y=o.userData.rotCurrent;
        }
      });
      [state.player,...state.enemies].forEach(o=>{if(o?.userData?.turnT!==undefined&&o.userData.turnT<1){o.userData.turnT=Math.min(1,o.userData.turnT+dt/o.userData.turnDuration);const q=1-Math.pow(1-o.userData.turnT,3);o.rotation.y=THREE.MathUtils.lerp(o.userData.turnFrom,o.userData.turnTo,q)}});
      [state.player,...state.enemies].forEach(o=>{if(o?.userData?.impact?.life>0){const hit=o.userData.impact;hit.life=Math.max(0,hit.life-dt);const pulse=Math.sin((1-hit.life/hit.max)*Math.PI*4)*hit.power*Math.max(0,hit.life/hit.max);const scale=1+Math.max(0,pulse)*.2;o.scale.set(scale,scale,scale);if(o.userData.hitKick)o.position.addScaledVector(o.userData.hitKick,dt*5*hit.life/hit.max)}else if(o){o.scale.set(1,1,1)}});
      state.effects.forEach(f=>{f.life-=dt;if(f.vel){f.vel.y-=8*dt;f.obj.position.addScaledVector(f.vel,dt);f.obj.rotation.x+=dt*6}if(f.obj.material)f.obj.material.opacity=Math.max(0,f.life/f.max)});
      state.effects.filter(f=>f.life<=0).forEach(f=>scene.remove(f.obj));state.effects=state.effects.filter(f=>f.life>0);
      if(state.goal){state.goal.userData.crystal.rotation.y+=dt*1.6;state.goal.userData.crystal.position.y=1.35+Math.sin(t*2.4)*.18;state.goal.userData.ring.rotation.z+=dt*.6}
      state.enemies.filter(e=>e.userData.alive&&e.userData.type==="wisp").forEach(e=>{e.position.y=Math.sin(t*2+e.userData.id)*.22;e.children.slice(1,4).forEach((part,i)=>part.rotation.y+=dt*(i+1)*2)});
      if(state.aiming){cursor.material.opacity=.5+Math.sin(t*7)*.4;cursor.rotation.z+=dt*.8}
      const d=dirs[state.dir],followRate=1-Math.pow(.01,dt),focus=state.player.position.clone();cameraFollowDir.lerp(new THREE.Vector2(d.x,d.z),followRate).normalize();const desired=focus.clone().add(new THREE.Vector3(-cameraFollowDir.x*12+10,14,-cameraFollowDir.y*12+10));camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(focus.x,1,focus.z);
      renderer.render(scene,camera);
    }
    log("VR戦闘開始。黄色の転送出口へ向かえ。","#a7ff6a");log("SPACEで照準、Kでナイフを装備。");updateHUD();animate();
  })();
  </script>
</body>
</html>
